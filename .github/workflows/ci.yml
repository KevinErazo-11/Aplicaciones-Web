
name: Workshop 6 - Django CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: md_ci
          POSTGRES_USER: md_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U md_ci -d md_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Proyecto-MD/Backend

    env:
      DJANGO_SETTINGS_MODULE: settings.development
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-123456789012345
      POSTGRES_DB: md_ci
      POSTGRES_USER: md_ci
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Proyecto-MD/Backend/requirements/development.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Ruff
        run: ruff check config/urls.py tests/test_health.py

      - name: Run pytest
        run: pytest -q tests/test_health.py
