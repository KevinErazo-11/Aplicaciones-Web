name: Workshop Nov 6 - FastAPI CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Workshop-Nov-06/**"
      - ".github/workflows/docker-workshop-ci.yml"

  push:
    branches: [main]
    paths:
      - "Workshop-Nov-06/**"
      - ".github/workflows/docker-workshop-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Workshop-Nov-06

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Ruff
        run: ruff check app.py tests/

      - name: Run pytest
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t class-api:ci .
